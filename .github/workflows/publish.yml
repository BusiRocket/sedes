name: Publish

# Publishes the version in package.json to npm. Run from the Actions tab or
# with `gh workflow run publish.yml`, after the release commit and tag.
#
# Auth is tokenless via npm Trusted Publishing (OIDC): npmjs.com must list
# this repository (InteliFactu/papeleo) and this workflow (publish.yml) as a
# trusted publisher for the `papeleo` package, with the "npm publish" action
# allowed and no environment. pnpm exchanges the GitHub OIDC id-token for a
# short-lived publish credential, so no NPM_TOKEN exists anywhere. Provenance
# is generated automatically because the repository is public.

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC trusted publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Gate
        run: pnpm run check:ci

      - name: Build
        run: pnpm run build

      # --ignore-scripts skips the prepare/prepack hooks, which already ran.
      - name: Publish to npm
        run: pnpm publish --no-git-checks --ignore-scripts --access public
